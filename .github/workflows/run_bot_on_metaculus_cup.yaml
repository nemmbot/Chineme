name: Forecast on Metaculus Cup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *" # runs at midnight every 2 days

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          TID="${METACULUS_CUP_TOURNAMENT_ID:-minibench}"
          poetry run python main.py --tournament-ids "$TID"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          VULTR_SERVERLESS_INFERENCE_API_KEY: ${{ secrets.VULTR_SERVERLESS_INFERENCE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          METACULUS_CUP_TOURNAMENT_ID: ${{ vars.METACULUS_CUP_TOURNAMENT_ID }}